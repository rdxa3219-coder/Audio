
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1565c0">
  <title>Login - Audio Studio PRO</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <!-- Firebase Configuration -->
  <script src="firebase/firebase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5ff;
      font-family: Arial, sans-serif;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(21, 101, 192, .12);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #1565c0;
      font-size: 25px;
      margin: 0 0 8px;
    }

    .logo p {
      color: #667085;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
    }

    .tabs button {
      flex: 1;
      padding: 12px;
      border: 0;
      border-radius: 9px;
      background: #edf2fa;
      color: #475467;
      font-weight: bold;
      cursor: pointer;
    }

    .tabs button.active {
      background: #1565c0;
      color: #fff;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #344054;
      font-size: 14px;
      font-weight: bold;
    }

    .field input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    .field input:focus {
      border-color: #1565c0;
      box-shadow: 0 0 0 3px rgba(21, 101, 192, .1);
    }

    .main-btn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #1565c0;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .main-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .forgot {
      display: block;
      text-align: right;
      margin-bottom: 16px;
      color: #1565c0;
      font-size: 13px;
      cursor: pointer;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      color: #b42318;
      background: #fef3f2;
    }

    .message.success {
      display: block;
      color: #027a48;
      background: #ecfdf3;
    }

    .message.info {
      display: block;
      color: #175cd3;
      background: #eff8ff;
    }

    .hidden {
      display: none !important;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      color: #667085;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <main class="auth-card">

    <div class="logo">
      <h1>🎙️ Audio Studio PRO</h1>
      <p>AI Voice Lab & Audio Editor</p>
    </div>

    <div class="tabs">
      <button type="button" id="loginTab" class="active">
        Login
      </button>

      <button type="button" id="registerTab">
        Register
      </button>
    </div>

    <div id="message" class="message"></div>

    <form id="authForm">

      <div class="field">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter password"
          autocomplete="current-password"
          minlength="6"
          required
        >
      </div>

      <div class="field hidden" id="confirmField">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm password"
          autocomplete="new-password"
          minlength="6"
        >
      </div>

      <span id="forgotBtn" class="forgot">
        Forgot Password?
      </span>

      <button type="submit" class="main-btn" id="submitBtn">
        Login
      </button>

    </form>

    <div class="footer">
      Your account is protected by Firebase Authentication.
      <br>
      Audio Studio PRO
    </div>

  </main>

  <script>
  (function () {
    "use strict";

    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const authForm = document.getElementById("authForm");
    const submitBtn = document.getElementById("submitBtn");
    const forgotBtn = document.getElementById("forgotBtn");
    const confirmField = document.getElementById("confirmField");
    const messageBox = document.getElementById("message");

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");

    let currentMode = "login";
    let busy = false;

    function getAuth() {
      if (!window.firebaseServices ||
          !window.firebaseServices.auth) {
        throw new Error(
          "Firebase চালু হয়নি। firebase-config.js এবং Firebase SDK পরীক্ষা করো।"
        );
      }

      return window.firebaseServices.auth;
    }

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = "message " + type;
    }

    function clearMessage() {
      messageBox.textContent = "";
      messageBox.className = "message";
    }

    function setLoading(value) {
      busy = value;
      submitBtn.disabled = value;
      loginTab.disabled = value;
      registerTab.disabled = value;

      if (value) {
        submitBtn.textContent = "Please wait...";
      } else {
        submitBtn.textContent =
          currentMode === "login" ? "Login" : "Create Account";
      }
    }

    function setMode(mode) {
      if (busy) return;

      currentMode = mode;
      clearMessage();

      const isLogin = mode === "login";

      loginTab.classList.toggle("active", isLogin);
      registerTab.classList.toggle("active", !isLogin);

      confirmField.classList.toggle("hidden", isLogin);
      forgotBtn.classList.toggle("hidden", !isLogin);

      confirmInput.required = !isLogin;

      passwordInput.autocomplete =
        isLogin ? "current-password" : "new-password";

      submitBtn.textContent =
        isLogin ? "Login" : "Create Account";
    }

    loginTab.addEventListener("click", function () {
      setMode("login");
    });

    registerTab.addEventListener("click", function () {
      setMode("register");
    });

    function friendlyError(error) {
      const errors = {
        "auth/invalid-email":
          "Email Address সঠিক নয়।",

        "auth/user-not-found":
          "এই Email দিয়ে কোনো Account পাওয়া যায়নি।",

        "auth/wrong-password":
          "Password সঠিক নয়।",

        "auth/invalid-credential":
          "Email অথবা Password সঠিক নয়।",

        "auth/email-already-in-use":
          "এই Email দিয়ে Account আগে থেকেই আছে।",

        "auth/weak-password":
          "Password কমপক্ষে ৬ অক্ষরের হতে হবে।",

        "auth/too-many-requests":
          "অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করো।",

        "auth/network-request-failed":
          "Internet Connection পরীক্ষা করো।",

        "auth/operation-not-allowed":
          "Firebase Console-এ Email/Password Sign-in চালু করো।",

        "auth/unauthorized-domain":
          "Firebase Authentication-এর Authorized Domains পরীক্ষা করো।"
      };

      return errors[error.code] ||
        error.message ||
        "সমস্যা হয়েছে। আবার চেষ্টা করো।";
    }

    authForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (busy) return;

      clearMessage();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage("Email এবং Password পূরণ করো।", "error");
        return;
      }

      if (password.length < 6) {
        showMessage(
          "Password কমপক্ষে ৬ অক্ষরের হতে হবে।",
          "error"
        );
        return;
      }

      setLoading(true);

      try {
        const loginAuth = getAuth();

        if (currentMode === "register") {
          const confirmPassword = confirmInput.value;

          if (password !== confirmPassword) {
            throw new Error("দুটি Password মিলছে না।");
          }

          const result =
            await loginAuth.createUserWithEmailAndPassword(
              email,
              password
            );

          let verificationMessage =
            "Account সফলভাবে তৈরি হয়েছে।";

          try {
            await result.user.sendEmailVerification();

            verificationMessage +=
              " Verification Link Email-এ পাঠানো হয়েছে।";

          } catch (verificationError) {
            console.error(
              "Verification email error:",
              verificationError
            );

            verificationMessage +=
              " তবে Verification Email পাঠানো যায়নি।";
          }

          // নতুন Account তৈরি হওয়ার পর Session বন্ধ করা
          await loginAuth.signOut();

          setMode("login");

          passwordInput.value = "";
          confirmInput.value = "";

          showMessage(
            verificationMessage +
            " এখন একই Email ও Password দিয়ে Login করো।",
            "success"
          );

        } else {
          const result =
            await loginAuth.signInWithEmailAndPassword(
              email,
              password
            );

          if (result.user) {
            showMessage(
              "Login সফল হয়েছে। Dashboard খুলছে...",
              "success"
            );

            window.location.replace("dashboard.html");
          }
        }

      } catch (error) {
        console.error("Authentication error:", error);

        showMessage(
          friendlyError(error),
          "error"
        );

      } finally {
        setLoading(false);
      }
    });

    forgotBtn.addEventListener("click", async function () {
      if (busy) return;

      clearMessage();

      const email = emailInput.value.trim();

      if (!email) {
        showMessage(
          "Password Reset Link পাঠাতে Email Address দাও।",
          "error"
        );

        emailInput.focus();
        return;
      }

      setLoading(true);

      try {
        const loginAuth = getAuth();

        await loginAuth.sendPasswordResetEmail(email);

        showMessage(
          "Password Reset Link তোমার Email-এ পাঠানো হয়েছে।",
          "success"
        );

      } catch (error) {
        console.error("Password reset error:", error);

        showMessage(
          friendlyError(error),
          "error"
        );

      } finally {
        setLoading(false);
      }
    });

    // Firebase connection check
    try {
      getAuth();

      showMessage(
        "Firebase সংযোগ পাওয়া গেছে। Login অথবা Register করতে পারো।",
        "success"
      );

    } catch (error) {
      console.error("Firebase initialization error:", error);

      showMessage(
        error.message,
        "error"
      );
    }

  })();
  </script>

</body>
</html>
