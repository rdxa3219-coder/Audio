<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Changer</title><link rel="stylesheet" href="assets/css/style.css"></head><body><main class="panel"><h1>Voice Changer</h1><input type="file" accept="audio/*" id="voiceFile"><audio id="voicePlayer" controls></audio><label>Pitch <input id="pitch" type="range" min="0.5" max="2" step="0.05" value="1"></label><label>Playback speed <input id="speed" type="range" min="0.5" max="2" step="0.05" value="1"></label><p class="note">এখানে pitch/speed preview কন্ট্রোল আছে। AI voice conversion-এর জন্য পরে backend/API লাগবে।</p></main><script src="assets/js/voice.js"></script></body></html>
